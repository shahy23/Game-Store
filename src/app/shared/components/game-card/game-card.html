<a [routerLink]="['/products', game.id]" class="text-decoration-none text-reset">
  <div class="card h-100 game-card border-0 shadow-sm">
    <div class="position-relative overflow-hidden" style="aspect-ratio: 3/4;">
      <img [src]="game.image" [alt]="game.title" class="card-img-top w-100 h-100" style="object-fit: cover;" />

      @if (game.discountPrice) {
        <span class="badge bg-danger position-absolute top-0 start-0 m-2">
          -{{ (100 - (game.discountPrice / game.price) * 100) | number: '1.0-0' }}%
        </span>
      }

      <button
        class="btn btn-sm position-absolute top-0 end-0 m-2 rounded-circle"
        [class.btn-danger]="wishlist.isWishlisted(game.id)"
        [class.btn-light]="!wishlist.isWishlisted(game.id)"
        (click)="toggleWishlist($event)"
        title="Toggle wishlist"
      >
        <i class="bi" [class.bi-heart-fill]="wishlist.isWishlisted(game.id)" [class.bi-heart]="!wishlist.isWishlisted(game.id)"></i>
      </button>
    </div>

    <div class="card-body d-flex flex-column">
      <span class="badge bg-secondary-subtle text-secondary-emphasis align-self-start mb-2">{{ game.category }}</span>
      <h6 class="card-title fw-semibold mb-1 text-truncate">{{ game.title }}</h6>
      <app-star-rating [rating]="game.rating" class="mb-2 small"></app-star-rating>

      <div class="mt-auto d-flex justify-content-between align-items-center">
        <div>
          @if (game.discountPrice) {
            <span class="text-decoration-line-through text-secondary small me-1">${{ game.price }}</span>
            <span class="fw-bold text-info">${{ game.discountPrice }}</span>
          } @else {
            <span class="fw-bold">${{ game.price }}</span>
          }
        </div>
        <button class="btn btn-sm btn-outline-info" (click)="addToCart($event)" title="Add to cart">
          <i class="bi bi-cart-plus"></i>
        </button>
      </div>
    </div>
  </div>
</a>
