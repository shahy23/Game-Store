<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm p-4">
        <div class="text-center mb-4">
          <i class="bi bi-controller display-5 text-info"></i>
          <h3 class="fw-bold mt-2">Welcome Back</h3>
          <p class="text-secondary small mb-0">Log in to continue your gaming journey.</p>
        </div>

        @if (error) {
          <div class="alert alert-danger small">{{ error }}</div>
        }

        <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" novalidate>
          <div class="mb-3">
            <label class="form-label small">Email</label>
            <input
              type="email"
              class="form-control"
              name="email"
              required
              email
              [(ngModel)]="email"
              #emailModel="ngModel"
              [class.is-invalid]="emailModel.invalid && emailModel.touched"
            />
            @if (emailModel.invalid && emailModel.touched) {
              <div class="invalid-feedback">Please enter a valid email.</div>
            }
          </div>

          <div class="mb-3">
            <label class="form-label small">Password</label>
            <input
              type="password"
              class="form-control"
              name="password"
              required
              minlength="6"
              [(ngModel)]="password"
              #passwordModel="ngModel"
              [class.is-invalid]="passwordModel.invalid && passwordModel.touched"
            />
            @if (passwordModel.invalid && passwordModel.touched) {
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            }
          </div>

          <button type="submit" class="btn btn-info text-dark fw-semibold w-100">Log In</button>
        </form>

        <p class="text-center small text-secondary mt-4 mb-0">
          Don't have an account? <a routerLink="/register" class="text-info fw-semibold text-decoration-none">Sign Up</a>
        </p>
      </div>
    </div>
  </div>
</div>
