<div class="container py-5">
  <h2 class="fw-bold mb-4">Your Wishlist</h2>

  @if (wishlist.items().length === 0) {
    <div class="text-center py-5">
      <i class="bi bi-heart display-1 text-secondary"></i>
      <p class="text-secondary mt-3 mb-4">Nothing here yet. Save games you love for later!</p>
      <a routerLink="/products" class="btn btn-info text-dark fw-semibold">Browse Store</a>
    </div>
  } @else {
    <div class="row g-4">
      @for (game of wishlist.items(); track game.id) {
        <div class="col-6 col-md-4 col-lg-3">
          <app-game-card [game]="game"></app-game-card>
        </div>
      }
    </div>
  }
</div>
