<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="fw-bold mb-0">Game Store</h2>
    <span class="text-secondary small">{{ results.length }} game(s) found</span>
  </div>

  <!-- Category pills -->
  <div class="d-flex flex-wrap gap-2 mb-4">
    @for (cat of categories; track cat) {
      <button
        class="btn btn-sm btn-outline-secondary category-pill rounded-pill"
        [class.active]="selectedCategory === cat"
        (click)="setCategory(cat)"
      >
        {{ cat }}
      </button>
    }
  </div>

  <div class="row g-4">
    <!-- Filters sidebar -->
    <aside class="col-lg-3">
      <div class="card border-0 shadow-sm p-3 sticky-top" style="top: 90px;">
        <h6 class="fw-bold mb-3">Filters</h6>

        <label class="form-label small fw-semibold">Search</label>
        <input
          class="form-control form-control-sm mb-3"
          placeholder="Game title or tag..."
          [(ngModel)]="query"
          (ngModelChange)="applyFilters()"
        />

        <label class="form-label small fw-semibold">Platform</label>
        <select class="form-select form-select-sm mb-3" [(ngModel)]="selectedPlatform" (ngModelChange)="applyFilters()">
          <option value="">All Platforms</option>
          @for (p of platforms; track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>

        <label class="form-label small fw-semibold">Price Range ($)</label>
        <div class="d-flex gap-2 mb-3">
          <input type="number" class="form-control form-control-sm" placeholder="Min" [(ngModel)]="minPrice" (ngModelChange)="applyFilters()" />
          <input type="number" class="form-control form-control-sm" placeholder="Max" [(ngModel)]="maxPrice" (ngModelChange)="applyFilters()" />
        </div>

        <label class="form-label small fw-semibold">Sort By</label>
        <select class="form-select form-select-sm mb-3" [(ngModel)]="sortBy" (ngModelChange)="applyFilters()">
          <option value="">Relevance</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="newest">Newest</option>
        </select>

        <button class="btn btn-sm btn-outline-danger w-100" (click)="clearFilters()">
          <i class="bi bi-x-circle me-1"></i>Clear Filters
        </button>
      </div>
    </aside>

    <!-- Results -->
    <div class="col-lg-9">
      @if (results.length === 0) {
        <div class="text-center py-5">
          <i class="bi bi-emoji-frown display-4 text-secondary"></i>
          <p class="text-secondary mt-3">No games match your filters. Try adjusting your search.</p>
        </div>
      } @else {
        <div class="row g-4">
          @for (game of results; track game.id) {
            <div class="col-6 col-md-4">
              <app-game-card [game]="game"></app-game-card>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
